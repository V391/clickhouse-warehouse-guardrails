name: guardrails
version: "1.0.0"
profile: guardrails
config-version: 2

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target"]

vars:
  # Lower bound of the rows this load brought in (a ClickHouse server timestamp, set by the
  # Prefect flow). Gates measure rates over this load only. Unset means "everything".
  audit_since: "1970-01-01 00:00:00"

models:
  guardrails:
    staging:
      +materialized: view
    marts:
      +materialized: table
