name: ch-guardrails

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: demo
      CLICKHOUSE_PASSWORD: demo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user demo --password demo -q 'select 1'"]
      interval: 5s
      retries: 30

  # Optional: `docker compose --profile bi up -d superset`, then `python superset/bootstrap.py`.
  superset:
    profiles: ["bi"]
    build: ./superset
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py:ro
    ports:
      - "8088:8088"
    command:
      - bash
      - -c
      - >-
        superset db upgrade &&
        (superset fab create-admin --username admin --firstname Demo --lastname Admin --email admin@example.com --password admin || true) &&
        superset init &&
        gunicorn -w 2 -b 0.0.0.0:8088 --timeout 120 'superset.app:create_app()'
    depends_on:
      clickhouse:
        condition: service_healthy
